[project]
name = "iwbtgb"
version = "0.2.0"
description = "I wanna be the GB en Linux (vía OpenGMK) y algoritmos que aprenden a jugarlo: GA con TAS, Go-Explore y redes neuronales"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "gymnasium>=1.0",
    "pillow>=13.0.0",
    "matplotlib>=3.11.2",
    "pyside6-essentials>=6.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iwbtgb"]

